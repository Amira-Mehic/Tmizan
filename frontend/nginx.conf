server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

   
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statični fajlovi (JS, CSS, slike, fontovi) - dugotrajan keš, jer Vite
    # u imena fajlova ugrađuje hash pa se sigurno mijenja kad se sadržaj promijeni.
    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
