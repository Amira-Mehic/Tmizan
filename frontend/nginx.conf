# Preslikavanje zaglavlja za trajnu vezu, koju koristi sloj za promjene uživo.
# Kad preglednik zatraži nadogradnju veze, ona se prosljeđuje dalje, inače se
# veza zatvara na uobičajen način.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Zahtjevi prema bazi ne idu iz preglednika direktno na Supabase, nego kroz
    # ovaj poslužitelj, koji ih unutar Docker mreže prosljeđuje ulaznom
    # gatewayu Supabasea. Tako kontejner aplikacije i kontejneri baze zaista
    # komuniciraju međusobno, a prema van je otvoren samo jedan port.
    #
    # Kosa crta na kraju adrese u proxy_pass uklanja prefiks /supabase/, pa
    # gateway prima putanje u obliku /rest/v1/..., /auth/v1/... i /storage/v1/...
    #
    # Oznaka ^~ daje ovom pravilu prednost nad pravilom za statične datoteke
    # ispod, koje se zasniva na regularnom izrazu.
    location ^~ /supabase/ {
        proxy_pass http://supabase_kong_Tmizan:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Odgovori se ne zadržavaju u međuspremniku, jer se dio saobraćaja
        # prenosi kao trajni tok podataka.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 50m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statične datoteke (JS, CSS, slike, fontovi) - dugotrajan keš, jer Vite
    # u imena datoteka ugrađuje hash pa se sigurno mijenja kad se sadržaj promijeni.
    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
